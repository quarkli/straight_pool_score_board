<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>更新計分板</title><style>body{font:20px sans-serif;max-width:600px;margin:15vh auto;padding:24px;line-height:1.8;color:#173f32}button{font:inherit;padding:12px 24px}a{color:inherit}</style><h1>更新計分板</h1><p>重新下載目前版本，保留此瀏覽器的對局歷史、練習及設定。需要網路連線。</p><button id="update">立即更新</button><p id="status" role="status"></p><script>
document.getElementById('update').onclick=async function(){this.disabled=true;var status=document.getElementById('status');status.textContent='正在下載最新版…';try{var base=new URL('./',location.href);var response=await fetch(new URL('index.html?update='+Date.now(),base),{cache:'reload'});if(!response.ok)throw Error('下載失敗');var html=await response.text();if(html.indexOf('id="app"')<0)throw Error('下載內容不正確');if('serviceWorker' in navigator){var regs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<regs.length;i++){if(regs[i].scope===base.href)await regs[i].unregister();}}if('caches' in window){var keys=await caches.keys();await Promise.all(keys.filter(function(k){return k.indexOf('straight-pool-app-')===0;}).map(function(k){return caches.delete(k);}));}location.replace(new URL('./?update='+Date.now()+'#history',base).href);}catch(e){status.textContent='更新失敗，請確認網路連線後重試。'+e.message;this.disabled=false;}};
</script></html>
